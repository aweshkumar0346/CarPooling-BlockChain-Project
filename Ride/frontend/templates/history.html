<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ride History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://th.bing.com/th/id/OIP.ibRzQ_R5jTDxYlXf_YXIPgHaFW?rs=1&pid=ImgDetMain'); /* Background Image */
            background-size: cover;
            background-position: center center;
            height: 100vh;
            color: #fff; /* White text to contrast with the background */
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: -1;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100%;
            text-align: center;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.6); /* Dark background for cards */
            padding: 20px;
            border-radius: 10px;
            color: white;
            width: 18rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: scale(1.05); /* Slight zoom effect on hover */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* Enhanced shadow on hover */
        }

        h2 {
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Ride History</h2>
        <div class="card-container">
            {% for ride in rides %}
                <div class="card">
                    <h5 class="card-title">{{ ride[2] }} → {{ ride[3] }}</h5>
                    <p class="card-text">Fare: {{ ride[4] }} wei</p>
                    <small>Status: {% if ride[5] %}Booked{% else %}Available{% endif %}</small>
                </div>
            {% endfor %}
        </div>
        <a href="/" class="btn btn-secondary mt-3">Back</a>
    </div>
</body>
</html>
