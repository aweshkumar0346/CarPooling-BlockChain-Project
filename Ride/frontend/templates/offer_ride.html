<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offer Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://th.bing.com/th/id/R.b45d4ea4d10a336a08903fc71d1c22dc?rik=KK2U2OT8wiCltw&riu=http%3a%2f%2ffraservalleynewsnetwork.com%2fwp-content%2fuploads%2f2017%2f11%2fCarpool-1-Chilliwack-Carpools.jpg&ehk=b1dU5CIpHfKZn8N2eZ9fINF0EOKJriKYGdIYqKT1BmI%3d&risl=&pid=ImgRaw&r=0'); /* Background Image */
            background-size: cover;
            background-position: center center;
            height: 100vh;
            color: #fff; /* White text to contrast with the background */
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: -1;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.7); /* Slightly darker background for the form */
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Offer a New Ride</h2>
            <form method="POST">
                <div class="mb-3">
                    <label for="origin" class="form-label">Origin</label>
                    <input type="text" name="origin" id="origin" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="destination" class="form-label">Destination</label>
                    <input type="text" name="destination" id="destination" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="fare" class="form-label">Fare (wei)</label>
                    <input type="number" name="fare" id="fare" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                <a href="/" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</body>
</html>
